; Node sensor ESP8266 (NodeMCU Amica / v2, ESP-12E)
;
; Proyek TERPISAH dari src/esp32_sensor_node, bukan env tambahan di sana.
; Alasannya: seluruh firmware ESP32 bergantung pada FreeRTOS dua-core,
; Preferences (NVS), dan dua bus I2C — tidak satu pun ada di ESP8266.
; Menggabungkannya lewat build_src_filter akan membuat kedua build saling
; merusak setiap kali salah satunya berubah.
;
; Node ini HANYA sensor: LSM6DS3 + BMP280. Tidak ada aktuator, buzzer,
; NeoPixel, servo, gas, maupun PIR.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
    adafruit/Adafruit LSM6DS @ ^4.7.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    https://github.com/tzapu/WiFiManager.git

build_flags =
    -D MQTT_MAX_PACKET_SIZE=1024
    -D BOARD_VARIANT=\"esp8266_nodemcu\"
    ; I2C NodeMCU: D2=GPIO4 (SDA), D1=GPIO5 (SCL).
    ; LSM6DS3 di 0x6A dan BMP280 di 0x76 tidak bentrok alamat, jadi keduanya
    ; berbagi satu-satunya bus I2C yang dimiliki ESP8266.
    -D PIN_I2C_SDA=4
    -D PIN_I2C_SCL=5
